name: Build NetSpeed Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install ldid dpkg curl

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

    - name: Setup iOS SDKs
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks

    - name: Setup RootHide Support
      run: |
        git clone https://github.com/roothide/theos-roothide.git $HOME/theos/vendor/roothide || true
        if [ -d "$HOME/theos/vendor/roothide/makefiles" ]; then
          cp -r $HOME/theos/vendor/roothide/makefiles/* $HOME/theos/makefiles/
        fi

    - name: Build Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetSpeed-DEB
        path: packages/*.deb
