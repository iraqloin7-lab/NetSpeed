name: Build NetSpeed Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install ldid dpkg curl

    - name: Setup Theos, SDKs & RootHide
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks || true
        git clone https://github.com/roothide/theos-roothide.git /tmp/theos-roothide || true
        
        # نسخ ملفات الـ roothide إلى الأماكن الصحيحة في Theos
        mkdir -p $HOME/theos/makefiles/package
        mkdir -p $HOME/theos/makefiles/targets
        
        if [ -d "/tmp/theos-roothide/makefiles" ]; then
          cp -R /tmp/theos-roothide/makefiles/* $HOME/theos/makefiles/
        fi
        if [ -d "/tmp/theos-roothide/package" ]; then
          cp -R /tmp/theos-roothide/package/* $HOME/theos/makefiles/package/
        fi
        if [ -d "/tmp/theos-roothide/targets" ]; then
          cp -R /tmp/theos-roothide/targets/* $HOME/theos/makefiles/targets/
        fi

    - name: Build Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetSpeed-DEB
        path: packages/*.deb
