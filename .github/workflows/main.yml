name: Build NetSpeed Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install ldid dpkg curl

    - name: Setup RootHide Theos & SDKs
      run: |
        git clone --recursive https://github.com/roothide/theos.git $HOME/theos
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks || true

    - name: Build Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetSpeed-DEB
        path: packages/*.deb
