name: Build NetSpeed Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install ldid dpkg

    - name: Setup Theos & RootHide SDK
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
        # تحميل SDK
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/* $THEOS/sdks/
        rm -rf sdks-master master.zip
        
        # إضافة دعم RootHide إلى Theos
        git clone https://github.com/roothide/theos-roothide.git $THEOS/vendor/roothide || true
        if [ -d "$THEOS/vendor/roothide/makefiles" ]; then
          cp -r $THEOS/vendor/roothide/makefiles/* $THEOS/makefiles/
        fi

    - name: Build Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetSpeed-DEB
        path: packages/*.deb
